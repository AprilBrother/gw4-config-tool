name: Build/release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ${{ matrix.os.image }}

    strategy:
      matrix:
        os:
          - {name: 'windows', image: 'windows-latest'}
          - {name: 'macos-arm64', image: 'macos-latest'}
          - {name: 'macos-x86', image: 'macos-latest-large'}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Build & Release Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.os.name == 'windows' && secrets.windows_certs || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os.name == 'windows' && secrets.windows_certs_password || '' }}
        shell: bash
        run: |
          echo "Building for ${{ matrix.os.name }}"

          if [[ "${{ matrix.os.name }}" == "windows" ]]; then
            echo "🔐 Windows code signing enabled"
            npx electron-builder --publish always
          else
            echo "📦 macOS build without code signing"
            npx electron-builder --publish always \
              --mac \
              -c.mac.identity=null \
              -c.mac.sign=false \
              -c.mac.hardenRuntime=false
          fi
